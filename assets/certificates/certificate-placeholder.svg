  </defs>
  <rect width="1200" height="750" rx="44" fill="url(#bg)"/>
  <rect x="70" y="70" width="1060" height="610" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="6"/>
  <rect x="135" y="132" width="930" height="12" rx="6" fill="url(#line)"/>
